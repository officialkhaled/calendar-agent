services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/token.json:/app/token.json
      - ./backend/credentials.json:/app/credentials.json
      - ./backend/calpilot.db:/app/calpilot.db

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend